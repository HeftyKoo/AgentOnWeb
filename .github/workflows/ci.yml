name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-ci-pr-{0}', github.event.pull_request.number) || format('ci-ci-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: read
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        shell: bash
        run: |
          set -euo pipefail
          if gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" > "$RUNNER_TEMP/changes.json" &&
            jq -e --argjson count "$CHANGED_FILES" '
              add as $files |
              ($files | length) == $count and $count > 0 and
              all($files[]; all([.filename, (.previous_filename // .filename)][]; test("^README[.]md$")))
            ' "$RUNNER_TEMP/changes.json" >/dev/null &&
            test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)" = "$PR_HEAD"; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.5.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install shells for installer tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zsh fish
      - run: pnpm release:audit
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: agentonweb-${{ github.sha }}
          path: release/

  dsh-latest:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: ubuntu-24.04
    env:
      DSH_TEST_PREFIX: /tmp/agentonweb-dsh-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.5.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build extension and pack the actual DSH plugin
        run: |
          pnpm build
          pnpm --filter @agentonweb/dsh-surface pack --pack-destination "$PWD/release"
      - name: Install the latest DSH and an isolated test browser
        run: |
          npm install --prefix "$DSH_TEST_PREFIX" --no-audit --no-fund @deepseek-ai/dsh@latest playwright-core
          playwright="$DSH_TEST_PREFIX/node_modules/playwright-core/cli.js"
          node "$playwright" install chromium --no-shell
          if ! xvfb-run -a node <<'NODE'
          const { chromium } = require(process.env.DSH_TEST_PREFIX + '/node_modules/playwright-core');
          chromium.launch({ headless: false, timeout: 10000 })
            .then((browser) => browser.close())
            .catch((error) => { console.warn(error.message); process.exitCode = 1; });
          NODE
          then
            node "$playwright" install-deps chromium
          fi
      - name: Verify latest DSH plugin, settings UI and cookie authentication
        run: |
          chromium_executable=$(node -e 'console.log(require(process.env.DSH_TEST_PREFIX + "/node_modules/playwright-core").chromium.executablePath())')
          DSH_CONNECTION_MODULE="$DSH_TEST_PREFIX/node_modules/@deepseek-ai/dsh-client-connection/lib/index.js" pnpm exec vitest run packages/dsh-surface-plugin/src/routes.test.ts
          xvfb-run -a node scripts/check-dsh-plugin.mjs --deps "$DSH_TEST_PREFIX" --chromium "$chromium_executable"
          xvfb-run -a node scripts/check-dsh-auth-browser.mjs --deps "$DSH_TEST_PREFIX" --chromium "$chromium_executable"
